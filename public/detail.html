<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小程序详情 · AppSeeker</title>
<script>(function(){try{var t=window.localStorage.getItem('appseeker:theme');document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');}catch(e){}})();</script>
<link rel="stylesheet" href="css/style.css?v=7">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 3v18h18"></path>
          <path d="M7 17v-5"></path>
          <path d="M12 17V9"></path>
          <path d="M17 17v-3"></path>
        </svg>
      </span>
      <div class="brand-text">
        <h1>AppSeeker</h1>
        <p>小程序机会雷达 · 每日自动更新两次</p>
      </div>
    </div>

    <div class="topbar-actions">
      <span class="search-wrap topbar-search">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="M20 20l-3.5-3.5"></path>
        </svg>
        <input id="q" type="search" placeholder="搜索并回到榜单…" autocomplete="off">
      </span>
      <span class="chip chip-quiet" id="upd">正在载入数据…</span>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="切换配色">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"></path>
          <circle cx="12" cy="12" r="4"></circle>
        </svg>
      </button>
    </div>
  </div>
</header>

<main class="shell">

  <div class="crumb" id="crumb"></div>

  <section class="panel dhead" id="dhead"></section>

  <section class="dcards" id="dcards"></section>

  <section class="panel chartcard">
    <h3>趋势 · 热度与好评率</h3>
    <p>柱形为估算热度量级（左轴，口径随平台：小程序为下载量，HTML5 游戏为游玩次数），折线为好评率（右轴）。数据来自每日两次的管道快照，随抓取逐日累积。</p>
    <div id="trend"></div>
  </section>

  <section class="panel chartcard" id="cmpCard" style="display:none">
    <h3>跨平台同名对比</h3>
    <p>同一名称出现在多个平台时的横向对比，用于判断「需求强、体验差」是否跨平台成立。</p>
    <div id="cmp"></div>
  </section>

  <section class="panel prov" id="prov"></section>

  <footer class="site-footer">
    <p id="footMeta"></p>
    <p>数据来源于各平台公开榜单 / 模拟示例数据，仅做聚合统计展示，不含任何用户个人信息；内容仅供参考，不构成投资建议。</p>
    <p class="footer-links">同一台服务器上的其他站点：<a href="http://101.132.195.92/gameseek/">新游雷达</a> · <a href="http://101.132.195.92/gameqker/">出海军情表</a> · <a href="http://101.132.195.92/">站点导航</a></p>
  </footer>

</main>

<script src="data/latest.js"></script>
<script src="data/history.js"></script>
<script src="js/detail.js?v=7"></script>
</body>
</html>
