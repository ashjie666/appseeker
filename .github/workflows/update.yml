# AppSeeker · 云端数据管道
#
# 每日两次刷新榜单数据，并把整站同时发布到 GitHub Pages 与阿里云服务器。
#
# 触发时点（cron 一律使用 UTC，北京时间 = UTC + 8）：
#   '7 23 * * *'  →  北京时间 07:07
#   '7 11 * * *'  →  北京时间 19:07
# 刻意避开整点：GitHub 的定时任务在整点前后极度拥堵，常延迟数十分钟；错开可明显提升准点率。
# 另注：schedule 事件只在**默认分支**上生效。
#
# 设计要点：
#   - refresh 用 windows-latest + Windows PowerShell，与本地验证环境完全一致，脚本零改造
#   - 两个部署 job 并列，都 needs: refresh；任一失败不阻塞另一个（与 gameseek / gameqker 写法一致）
#   - 两个部署 job 都消费 refresh 上传的 site 产物，**不要自己 checkout** ——
#     那会拿到触发提交里的旧数据，比 refresh 慢一个周期
#   - 站点内所有资源引用均为相对路径，Pages 的 /<repo>/ 与阿里云的 /appseeker/ 子路径都天然兼容
#   - 快照目录只保留最近 6 份，避免仓库体积随每日两次运行持续膨胀
#
# 阿里云部署依赖仓库 Secrets：SSH_HOST / SSH_USER / SSH_KEY，且服务器已安装 rsync。
# 目标目录 /www/wwwroot/sites/appseeker/ 与 gameseek、gameqker 并列在同一个 nginx 公共父目录下，
# rsync 会自动创建该子目录，无需修改 nginx 配置、也无需重载服务。

name: Refresh data and deploy

on:
  schedule:
    - cron: '7 23 * * *'
    - cron: '7 11 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: appseeker-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run data pipeline
        shell: powershell
        run: |
          & (Join-Path $PWD 'pipeline\run.ps1')

          # 管道内部会捕获异常并写入 last-run.json，故不能只依赖退出码，必须核对状态
          $logPath = Join-Path $PWD 'data\logs\last-run.json'
          if (-not (Test-Path -LiteralPath $logPath)) { throw 'data/logs/last-run.json not found' }
          $log = Get-Content -LiteralPath $logPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($log.status -ne 'success') { throw "pipeline status = $($log.status)" }
          Write-Host 'pipeline ok'

      - name: Trim old snapshots
        shell: powershell
        run: |
          $dir = Join-Path $PWD 'data\snapshots'
          if (Test-Path -LiteralPath $dir) {
            $all = @(Get-ChildItem -LiteralPath $dir -Filter *.json -File | Sort-Object Name)
            if ($all.Count -gt 6) {
              $all[0..($all.Count - 7)] | Remove-Item -Force
            }
            Write-Host ('snapshots kept: ' + @(Get-ChildItem -LiteralPath $dir -Filter *.json -File).Count)
          }

      - name: Commit refreshed data
        shell: powershell
        run: |
          git config user.name 'appseeker-bot'
          git config user.email 'appseeker-bot@users.noreply.github.com'
          git add public/data data/snapshots data/logs

          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'chore(data): refresh ranking snapshot'
            git push
            Write-Host 'data committed and pushed'
          } else {
            Write-Host 'no data change, skip commit'
          }
          exit 0

      # 同一份站点产物交给下面两个部署 job，保证它们发布的都是本次 refresh 的结果
      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: public

  deploy-pages:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4

  # 与 deploy-pages 并列、互不影响：它失败不会让 Pages 不发布，反之亦然。
  deploy-aliyun:
    needs: refresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: 推送静态站到阿里云
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" "mkdir -p /www/wwwroot/sites/appseeker"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            site/ "$SSH_USER@$SSH_HOST:/www/wwwroot/sites/appseeker/"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "chown -R www:www /www/wwwroot/sites/appseeker && find /www/wwwroot/sites/appseeker -type d -exec chmod 755 {} \; && find /www/wwwroot/sites/appseeker -type f -exec chmod 644 {} \;"
